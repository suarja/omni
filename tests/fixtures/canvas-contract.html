  <style>
:root{--node-w:264px;--node-h:72px;--radius:10px;--float-border:#e2e6e2;--faint:#a3a9ac;--skill:#997535;}
.node{position:absolute;width:var(--node-w);min-height:var(--node-h);display:flex;align-items:center;gap:12px;padding:10px 40px 10px 12px;border:1px solid var(--float-border);border-radius:var(--radius);background:linear-gradient(180deg,#fff,#fbfbf8);box-shadow:inset 0 1px 0 #fff,0 1px 3px #2833280d;text-align:left}
.node.center{box-shadow:0 0 0 3px #e3e9f3,0 1px 3px #2833280d;border-color:#c9d3e2}
.tile{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 12%,#fff);color:var(--tone)}
.ntitle{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ninfo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--faint);display:grid;place-items:center}
</style>
